name: linkmesh
description: Offline-first mesh messaging over Bluetooth Low Energy.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  ble_peripheral: ^2.4.0        # GATT server + advertising (peripheral role)
  flutter_blue_plus: ^2.3.14    # scanning + GATT client (central role)
  flutter_riverpod: ^3.4.3
  geolocator: ^14.1.1           # GPS for SOS, works without internet
  path: ^1.9.1
  permission_handler: ^12.0.1
  sqflite: ^2.4.4
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
